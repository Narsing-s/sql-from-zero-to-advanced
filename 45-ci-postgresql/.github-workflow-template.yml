name: PostgreSQL curriculum tests

on:
  push:
  pull_request:

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 45-ci-postgresql
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: sql_curriculum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sql_curriculum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run curriculum tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sql_curriculum
        run: bash scripts/run-sql-tests.sh