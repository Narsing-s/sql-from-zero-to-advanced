name: PostgreSQL Curriculum Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres-18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sql_curriculum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sql_curriculum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run deterministic PostgreSQL tests
        working-directory: 45-ci-postgresql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sql_curriculum
        run: bash scripts/run-sql-tests.sh

  repository-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit curriculum files
        shell: bash
        run: |
          test -f README.md
          test -f ROADMAP.md
          test -f MISSING-CONCEPTS-CHECKLIST.md
          test -d 45-ci-postgresql
          test -d 46-database-client-integration
          test -d 47-advanced-concurrency
          test -d 48-data-loading-and-export
          echo "Curriculum structure audit passed."